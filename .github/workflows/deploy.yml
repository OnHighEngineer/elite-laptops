name: Manual Deployment Pipeline

on:
  workflow_dispatch:

jobs:
  manual-deploy:
    name: Manual Trigger Deployment Check
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ytrfmqubfoagnehcpajk.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_zKCZBkRBV_UI5cHeS36dhg_ebAEwUPp' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-service-role-key-placeholder' }}
      NEXT_PUBLIC_SITE_URL: "https://elite-laptops-fk48.vercel.app"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test -- --run

      - name: Validate Production Build
        run: npm run build
